<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 760 300" role="img" aria-labelledby="dt-t dt-d"><title id="dt-t">Timing chain and judgement windows</title><desc id="dt-d">Song time is read from the audio DSP clock relative to a scheduled start, minus the chart's offset and the player's calibrated device offset. It is converted to beats to sample line and target state. A tap is compared with the note's time: within 100 milliseconds is Perfect, within 250 milliseconds is Great, and anything outside is a Miss.</desc><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#303953}
.d-muted{fill:#555e79}.d-line{stroke:#8f93bf}.d-accent{stroke:#8377dc}.d-accent-fill{fill:#8377dc}
.d-box{fill:#ffffff;stroke:#8f93bf}.d-box-accent{fill:#f1eefc;stroke:#8377dc}
.d-label{font-family:'Poppins','Century Gothic',system-ui,sans-serif;letter-spacing:.12em;font-size:11px;fill:#555e79}
@media (prefers-color-scheme:dark){text{fill:#e9e8f7}.d-muted,.d-label{fill:#aab0cc}.d-box{fill:#181b29;stroke:#6a7098}.d-box-accent{fill:#1f2236;stroke:#a99ff0}.d-line{stroke:#6a7098}.d-accent{stroke:#a99ff0}.d-accent-fill{fill:#a99ff0}}
</style><rect width="100%" height="100%" fill="#fcfbff"/><defs>
<marker id="dt-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-line" stroke-width="1.4"/></marker>
<marker id="dt-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-accent" stroke-width="1.4"/></marker>
</defs><text x="20" y="22" text-anchor="start" class="d-label">WHERE SONG TIME COMES FROM</text><rect x="20" y="40" width="140" height="58" rx="4" class="d-box-accent" stroke-width="1"/><path d="M30 40 h16" class="d-accent" stroke-width="2"/><text x="90" y="65.5" text-anchor="middle" font-size="12.5" font-weight="600">Audio DSP clock</text><text x="90" y="80.5" text-anchor="middle" font-size="11.5" class="d-muted">not frame time</text><rect x="190" y="40" width="250" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M200 40 h16" class="d-accent" stroke-width="2"/><text x="315" y="65.5" text-anchor="middle" font-size="12.5" font-weight="600">songTime = dspNow − start</text><text x="315" y="80.5" text-anchor="middle" font-size="11.5" class="d-muted">− chart offset − device calibration</text><rect x="466" y="40" width="150" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M476 40 h16" class="d-accent" stroke-width="2"/><text x="541" y="65.5" text-anchor="middle" font-size="12.5" font-weight="600">Beat</text><text x="541" y="80.5" text-anchor="middle" font-size="11.5" class="d-muted">songTime × BPM ÷ 60</text><rect x="640" y="40" width="100" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M650 40 h16" class="d-accent" stroke-width="2"/><text x="690" y="65.5" text-anchor="middle" font-size="12.5" font-weight="600">Sample</text><text x="690" y="80.5" text-anchor="middle" font-size="11.5" class="d-muted">lines, targets</text><path d="M160 69 L188 69" class="d-accent" fill="none" stroke-width="1.3" marker-end="url(#dt-head-a)"/><path d="M440 69 L464 69" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dt-head)"/><path d="M616 69 L638 69" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dt-head)"/><text x="20" y="150" text-anchor="start" class="d-label">JUDGING ONE TAP (DEFAULT WINDOWS)</text><rect x="151.42857142857144" y="204" width="457.1428571428571" height="52" rx="3" class="d-box" stroke-width="1"/><rect x="288.57142857142856" y="204" width="182.85714285714286" height="52" rx="3" class="d-box-accent" stroke-width="1"/><path d="M60 230H700" class="d-line" stroke-width="1"/><path d="M105.71428571428572 260v6" class="d-line" stroke-width="1"/><text x="105.71428571428572" y="280" text-anchor="middle" font-size="11" class="d-muted">−300 ms</text><path d="M197.14285714285714 260v6" class="d-line" stroke-width="1"/><text x="197.14285714285714" y="280" text-anchor="middle" font-size="11" class="d-muted">−200 ms</text><path d="M288.57142857142856 260v6" class="d-line" stroke-width="1"/><text x="288.57142857142856" y="280" text-anchor="middle" font-size="11" class="d-muted">−100 ms</text><path d="M380 260v6" class="d-line" stroke-width="1"/><text x="380" y="280" text-anchor="middle" font-size="11" class="d-muted">note time</text><path d="M471.42857142857144 260v6" class="d-line" stroke-width="1"/><text x="471.42857142857144" y="280" text-anchor="middle" font-size="11" class="d-muted">+100 ms</text><path d="M562.8571428571429 260v6" class="d-line" stroke-width="1"/><text x="562.8571428571429" y="280" text-anchor="middle" font-size="11" class="d-muted">+200 ms</text><path d="M654.2857142857142 260v6" class="d-line" stroke-width="1"/><text x="654.2857142857142" y="280" text-anchor="middle" font-size="11" class="d-muted">+300 ms</text><text x="380" y="196" text-anchor="middle" font-size="11.5" class="d-muted">Perfect ±100 ms</text><text x="159.42857142857144" y="196" text-anchor="start" font-size="11.5" class="d-muted">Great ±250 ms</text><text x="60" y="196" text-anchor="start" font-size="11.5" class="d-muted">Miss</text><text x="700" y="196" text-anchor="end" font-size="11.5" class="d-muted">Miss</text><path d="M345.25714285714287 225L350.25714285714287 230L345.25714285714287 235L340.25714285714287 230Z" class="d-accent-fill d-accent" fill="" stroke-width="1.3"/><text x="345.25714285714287" y="246" text-anchor="middle" font-size="10.5" class="d-muted">Perfect</text><path d="M537.2571428571429 225L542.2571428571429 230L537.2571428571429 235L532.2571428571429 230Z" class="d-accent-fill d-accent" fill="" stroke-width="1.3"/><text x="537.2571428571429" y="246" text-anchor="middle" font-size="10.5" class="d-muted">Great</text></svg>