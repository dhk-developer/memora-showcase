<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 760 280" role="img" aria-labelledby="dr-t dr-d"><title id="dr-t">Phrase presets compile to independent chart records</title><desc id="dr-d">A library phrase preset holds records with local IDs, typed parameters and ports. Applying it is a single undoable step that remaps IDs so they are unique in the chart, binds ports to chosen lines and validates parameters. The result is ordinary editable chart data pinned to the preset version. Later library versions never change a finished chart silently; re-applying is explicit and blocked if the author made local edits.</desc><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#303953}
.d-muted{fill:#555e79}.d-line{stroke:#8f93bf}.d-accent{stroke:#8377dc}.d-accent-fill{fill:#8377dc}
.d-box{fill:#ffffff;stroke:#8f93bf}.d-box-accent{fill:#f1eefc;stroke:#8377dc}
.d-label{font-family:'Poppins','Century Gothic',system-ui,sans-serif;letter-spacing:.12em;font-size:11px;fill:#555e79}
@media (prefers-color-scheme:dark){text{fill:#e9e8f7}.d-muted,.d-label{fill:#aab0cc}.d-box{fill:#181b29;stroke:#6a7098}.d-box-accent{fill:#1f2236;stroke:#a99ff0}.d-line{stroke:#6a7098}.d-accent{stroke:#a99ff0}.d-accent-fill{fill:#a99ff0}}
</style><rect width="100%" height="100%" fill="#fcfbff"/><defs>
<marker id="dr-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-line" stroke-width="1.4"/></marker>
<marker id="dr-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-accent" stroke-width="1.4"/></marker>
</defs><text x="20" y="22" text-anchor="start" class="d-label">LIBRARY</text><rect x="20" y="40" width="214" height="104" rx="4" class="d-box" stroke-width="1"/><path d="M30 40 h16" class="d-accent" stroke-width="2"/><text x="127" y="73.5" text-anchor="middle" font-size="12.5" font-weight="600">Phrase preset · v3</text><text x="127" y="88.5" text-anchor="middle" font-size="11.5" class="d-muted">records with local IDs a, b, c</text><text x="127" y="103.5" text-anchor="middle" font-size="11.5" class="d-muted">typed parameters: count, spacing</text><text x="127" y="118.5" text-anchor="middle" font-size="11.5" class="d-muted">port: target line</text><text x="262" y="22" text-anchor="start" class="d-label">APPLY (ONE UNDO STEP)</text><rect x="262" y="40" width="250" height="104" rx="4" class="d-box-accent" stroke-width="1"/><path d="M272 40 h16" class="d-accent" stroke-width="2"/><text x="387" y="73.5" text-anchor="middle" font-size="12.5" font-weight="600">Compile</text><text x="387" y="88.5" text-anchor="middle" font-size="11.5" class="d-muted">remap IDs → unique in this chart</text><text x="387" y="103.5" text-anchor="middle" font-size="11.5" class="d-muted">bind port → chosen line</text><text x="387" y="118.5" text-anchor="middle" font-size="11.5" class="d-muted">validate parameters and dependencies</text><text x="540" y="22" text-anchor="start" class="d-label">CHART</text><rect x="540" y="40" width="200" height="104" rx="4" class="d-box" stroke-width="1"/><path d="M550 40 h16" class="d-accent" stroke-width="2"/><text x="640" y="81" text-anchor="middle" font-size="12.5" font-weight="600">Independent records</text><text x="640" y="96" text-anchor="middle" font-size="11.5" class="d-muted">ordinary, editable chart data</text><text x="640" y="111" text-anchor="middle" font-size="11.5" class="d-muted">instance pinned to v3</text><path d="M234 92 L260 92" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dr-head)"/><path d="M512 92 L538 92" class="d-accent" fill="none" stroke-width="1.3" marker-end="url(#dr-head-a)"/><rect x="20" y="196" width="214" height="64" rx="4" class="d-box" stroke-width="1"/><path d="M30 196 h16" class="d-accent" stroke-width="2"/><text x="127" y="224.5" text-anchor="middle" font-size="12.5" font-weight="600">Phrase preset · v4</text><text x="127" y="239.5" text-anchor="middle" font-size="11.5" class="d-muted">library edited later</text><path d="M127 144 L127 194" class="d-line" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dr-head)"/><rect x="540" y="196" width="200" height="64" rx="4" class="d-box" stroke-width="1"/><path d="M550 196 h16" class="d-accent" stroke-width="2"/><text x="640" y="224.5" text-anchor="middle" font-size="12.5" font-weight="600">Chart unchanged</text><text x="640" y="239.5" text-anchor="middle" font-size="11.5" class="d-muted">until the author re-applies</text><path d="M234 228 L538 228" class="d-line" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dr-head)"/><text x="386" y="220" text-anchor="middle" font-size="11.5" class="d-muted">no silent changes · local edits block re-apply</text></svg>