<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 760 380" role="img" aria-labelledby="dp-t dp-d"><title id="dp-t">Authoring to runtime pipeline</title><desc id="dp-d">A chart file is loaded through compatibility checks into a chart model with stable IDs. Revisioned indexes feed shared evaluators that turn a beat into state. The same evaluators drive both the editor preview and gameplay, which feeds judgement and the renderers. Editor changes go through typed edit transactions that invalidate only affected caches, and saving runs preflight checks.</desc><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#303953}
.d-muted{fill:#555e79}.d-line{stroke:#8f93bf}.d-accent{stroke:#8377dc}.d-accent-fill{fill:#8377dc}
.d-box{fill:#ffffff;stroke:#8f93bf}.d-box-accent{fill:#f1eefc;stroke:#8377dc}
.d-label{font-family:'Poppins','Century Gothic',system-ui,sans-serif;letter-spacing:.12em;font-size:11px;fill:#555e79}
@media (prefers-color-scheme:dark){text{fill:#e9e8f7}.d-muted,.d-label{fill:#aab0cc}.d-box{fill:#181b29;stroke:#6a7098}.d-box-accent{fill:#1f2236;stroke:#a99ff0}.d-line{stroke:#6a7098}.d-accent{stroke:#a99ff0}.d-accent-fill{fill:#a99ff0}}
</style><rect width="100%" height="100%" fill="#fcfbff"/><defs>
<marker id="dp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-line" stroke-width="1.4"/></marker>
<marker id="dp-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-accent" stroke-width="1.4"/></marker>
</defs><text x="20" y="20" text-anchor="start" class="d-label">SHARED DATA PATH</text><path d="M386 58V36H80V56" fill="none" class="d-line" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dp-head)"/><text x="233" y="31" text-anchor="middle" font-size="11" class="d-muted">save, with preflight checks</text><rect x="20" y="58" width="120" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M30 58 h16" class="d-accent" stroke-width="2"/><text x="80" y="83.5" text-anchor="middle" font-size="12.5" font-weight="600">Chart file</text><text x="80" y="98.5" text-anchor="middle" font-size="11.5" class="d-muted">readable JSON</text><rect x="168" y="58" width="130" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M178 58 h16" class="d-accent" stroke-width="2"/><text x="233" y="76" text-anchor="middle" font-size="12.5" font-weight="600">Load</text><text x="233" y="91" text-anchor="middle" font-size="11.5" class="d-muted">compatibility,</text><text x="233" y="106" text-anchor="middle" font-size="11.5" class="d-muted">normalisation</text><rect x="326" y="58" width="120" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M336 58 h16" class="d-accent" stroke-width="2"/><text x="386" y="83.5" text-anchor="middle" font-size="12.5" font-weight="600">Chart model</text><text x="386" y="98.5" text-anchor="middle" font-size="11.5" class="d-muted">stable IDs</text><rect x="474" y="58" width="120" height="58" rx="4" class="d-box" stroke-width="1"/><path d="M484 58 h16" class="d-accent" stroke-width="2"/><text x="534" y="83.5" text-anchor="middle" font-size="12.5" font-weight="600">Indexes</text><text x="534" y="98.5" text-anchor="middle" font-size="11.5" class="d-muted">revisioned caches</text><rect x="622" y="58" width="120" height="58" rx="4" class="d-box-accent" stroke-width="1"/><path d="M632 58 h16" class="d-accent" stroke-width="2"/><text x="682" y="83.5" text-anchor="middle" font-size="12.5" font-weight="600">Evaluators</text><text x="682" y="98.5" text-anchor="middle" font-size="11.5" class="d-muted">beat → state</text><path d="M140 87 L166 87" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M298 87 L324 87" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M446 87 L472 87" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M594 87 L620 87" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><text x="20" y="160" text-anchor="start" class="d-label">AUTHORING (EDITOR ONLY)</text><rect x="20" y="176" width="160" height="88" rx="4" class="d-box" stroke-width="1"/><path d="M30 176 h16" class="d-accent" stroke-width="2"/><text x="100" y="201.5" text-anchor="middle" font-size="12.5" font-weight="600">Charting editor</text><text x="100" y="216.5" text-anchor="middle" font-size="11.5" class="d-muted">timeline · layers</text><text x="100" y="231.5" text-anchor="middle" font-size="11.5" class="d-muted">phrase library</text><text x="100" y="246.5" text-anchor="middle" font-size="11.5" class="d-muted">audio + waveform</text><rect x="212" y="176" width="150" height="56" rx="4" class="d-box" stroke-width="1"/><path d="M222 176 h16" class="d-accent" stroke-width="2"/><text x="287" y="200.5" text-anchor="middle" font-size="12.5" font-weight="600">Edit transactions</text><text x="287" y="215.5" text-anchor="middle" font-size="11.5" class="d-muted">typed edits · undo</text><path d="M180 204 L210 204" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M320 176 L370 118" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M362 196 L520 196 L520 118" class="d-line" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dp-head)"/><text x="440" y="190" text-anchor="middle" font-size="11" class="d-muted">invalidate what changed</text><rect x="474" y="222" width="120" height="56" rx="4" class="d-box" stroke-width="1"/><path d="M484 222 h16" class="d-accent" stroke-width="2"/><text x="534" y="246.5" text-anchor="middle" font-size="12.5" font-weight="600">Editor preview</text><text x="534" y="261.5" text-anchor="middle" font-size="11.5" class="d-muted">any beat, any seek</text><rect x="622" y="222" width="120" height="56" rx="4" class="d-box" stroke-width="1"/><path d="M632 222 h16" class="d-accent" stroke-width="2"/><text x="682" y="246.5" text-anchor="middle" font-size="12.5" font-weight="600">Gameplay</text><text x="682" y="261.5" text-anchor="middle" font-size="11.5" class="d-muted">DSP-clocked</text><path d="M682 116 L682 220" class="d-accent" fill="none" stroke-width="1.3" marker-end="url(#dp-head-a)"/><path d="M650 116 L560 220" class="d-accent" fill="none" stroke-width="1.3" marker-end="url(#dp-head-a)"/><text x="700" y="170" text-anchor="start" font-size="11" class="d-muted">same</text><text x="700" y="184" text-anchor="start" font-size="11" class="d-muted">answer</text><path d="M474 256 L182 256" class="d-line" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dp-head)"/><text x="330" y="250" text-anchor="middle" font-size="11" class="d-muted">drawn in the editor</text><rect x="474" y="312" width="120" height="56" rx="4" class="d-box" stroke-width="1"/><path d="M484 312 h16" class="d-accent" stroke-width="2"/><text x="534" y="336.5" text-anchor="middle" font-size="12.5" font-weight="600">Renderers</text><text x="534" y="351.5" text-anchor="middle" font-size="11.5" class="d-muted">notes · effects</text><rect x="622" y="312" width="120" height="56" rx="4" class="d-box" stroke-width="1"/><path d="M632 312 h16" class="d-accent" stroke-width="2"/><text x="682" y="336.5" text-anchor="middle" font-size="12.5" font-weight="600">Judgement</text><text x="682" y="351.5" text-anchor="middle" font-size="11.5" class="d-muted">input → score</text><path d="M682 278 L682 310" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/><path d="M650 278 L566 310" class="d-line" fill="none" stroke-width="1.3" marker-end="url(#dp-head)"/></svg>