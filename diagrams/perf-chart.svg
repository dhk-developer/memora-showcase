<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 760 300" role="img" aria-labelledby="dq-t dq-d"><title id="dq-t">Editor repaint time before and after the optimisation</title><desc id="dq-d">Mean repaint time fell from 47.3 to 11.5 ms on chart A at beat 56, from 74.6 to 15.6 ms on chart B at beat 60, from 119.8 to 14.9 ms on chart C at beat 142, and from 121.4 to 12.9 ms on chart C at beat 296. After the change, three of the four sections sit under the 16.7 millisecond frame budget.</desc><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#303953}
.d-muted{fill:#555e79}.d-line{stroke:#8f93bf}.d-accent{stroke:#8377dc}.d-accent-fill{fill:#8377dc}
.d-box{fill:#ffffff;stroke:#8f93bf}.d-box-accent{fill:#f1eefc;stroke:#8377dc}
.d-label{font-family:'Poppins','Century Gothic',system-ui,sans-serif;letter-spacing:.12em;font-size:11px;fill:#555e79}
@media (prefers-color-scheme:dark){text{fill:#e9e8f7}.d-muted,.d-label{fill:#aab0cc}.d-box{fill:#181b29;stroke:#6a7098}.d-box-accent{fill:#1f2236;stroke:#a99ff0}.d-line{stroke:#6a7098}.d-accent{stroke:#a99ff0}.d-accent-fill{fill:#a99ff0}}
</style><rect width="100%" height="100%" fill="#fcfbff"/><defs>
<marker id="dq-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-line" stroke-width="1.4"/></marker>
<marker id="dq-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-accent" stroke-width="1.4"/></marker>
</defs><text x="20" y="22" text-anchor="start" class="d-label">MEAN EDITOR REPAINT, MS (LOWER IS BETTER)</text><rect x="440" y="12" width="14" height="8" rx="1" class="d-box" stroke-width="1"/><text x="460" y="20" text-anchor="start" font-size="11" class="d-muted">before</text><rect x="520" y="12" width="14" height="8" rx="1" class="d-accent-fill"/><text x="540" y="20" text-anchor="start" font-size="11" class="d-muted">after</text><path d="M266.8 38V270" class="d-accent" stroke-width="1" stroke-dasharray="2 3"/><text x="270.8" y="284" text-anchor="start" font-size="10.5" class="d-muted">16.7 ms ≈ one 60 fps frame</text><text x="188" y="60" text-anchor="end" font-size="12">Chart A · beat 56</text><rect x="200" y="44" width="189.1" height="14" rx="1.5" class="d-box" stroke-width="1"/><text x="395.12" y="55" text-anchor="start" font-size="11" class="d-muted">47.3</text><rect x="200" y="62" width="45.9" height="14" rx="1.5" class="d-accent-fill"/><text x="272.8" y="73" text-anchor="start" font-size="11" class="d-muted">11.5</text><text x="188" y="118" text-anchor="end" font-size="12">Chart B · beat 60</text><rect x="200" y="102" width="298.4" height="14" rx="1.5" class="d-box" stroke-width="1"/><text x="504.36" y="113" text-anchor="start" font-size="11" class="d-muted">74.6</text><rect x="200" y="120" width="62.4" height="14" rx="1.5" class="d-accent-fill"/><text x="272.8" y="131" text-anchor="start" font-size="11" class="d-muted">15.6</text><text x="188" y="176" text-anchor="end" font-size="12">Chart C · beat 142</text><rect x="200" y="160" width="479.3" height="14" rx="1.5" class="d-box" stroke-width="1"/><text x="685.3199999999999" y="171" text-anchor="start" font-size="11" class="d-muted">119.8</text><rect x="200" y="178" width="59.6" height="14" rx="1.5" class="d-accent-fill"/><text x="272.8" y="189" text-anchor="start" font-size="11" class="d-muted">14.9</text><text x="188" y="234" text-anchor="end" font-size="12">Chart C · beat 296</text><rect x="200" y="218" width="485.5" height="14" rx="1.5" class="d-box" stroke-width="1"/><text x="691.52" y="229" text-anchor="start" font-size="11" class="d-muted">121.4</text><rect x="200" y="236" width="51.5" height="14" rx="1.5" class="d-accent-fill"/><text x="272.8" y="247" text-anchor="start" font-size="11" class="d-muted">12.9</text></svg>