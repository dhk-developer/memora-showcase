<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 760 345" role="img" aria-labelledby="dj-t dj-d"><title id="dj-t">Judgement contract versus presentation</title><desc id="dj-d">A judgement line moves and rotates over one beat while a note follows a curved, animated approach path. At the hit beat the note arrives exactly at a hit point that the chart defines: a beat, a target and an action with fixed timing windows. Approach animation, line motion, effects and visual-only notes can change freely without changing that contract.</desc><style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;fill:#303953}
.d-muted{fill:#555e79}.d-line{stroke:#8f93bf}.d-accent{stroke:#8377dc}.d-accent-fill{fill:#8377dc}
.d-box{fill:#ffffff;stroke:#8f93bf}.d-box-accent{fill:#f1eefc;stroke:#8377dc}
.d-label{font-family:'Poppins','Century Gothic',system-ui,sans-serif;letter-spacing:.12em;font-size:11px;fill:#555e79}
@media (prefers-color-scheme:dark){text{fill:#e9e8f7}.d-muted,.d-label{fill:#aab0cc}.d-box{fill:#181b29;stroke:#6a7098}.d-box-accent{fill:#1f2236;stroke:#a99ff0}.d-line{stroke:#6a7098}.d-accent{stroke:#a99ff0}.d-accent-fill{fill:#a99ff0}}
</style><rect width="100%" height="100%" fill="#fcfbff"/><defs>
<marker id="dj-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-line" stroke-width="1.4"/></marker>
<marker id="dj-head-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 9 5 1 8.5" fill="none" class="d-accent" stroke-width="1.4"/></marker>
</defs><text x="20" y="26" text-anchor="start" class="d-label">WHAT THE PLAYER SEES</text><text x="470" y="26" text-anchor="start" class="d-label">WHAT IS JUDGED</text><path d="M79.1 72.4L300.9 103.6" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.4"/><text x="308.9100236990559" y="107.58738730752734" text-anchor="start" font-size="11.5" class="d-muted">t − 1 beat</text><path d="M102.1 153.9L325.9 146.1" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4"/><text x="333.9317726261387" y="150.0912563693199" text-anchor="start" font-size="11.5" class="d-muted">t − ½ beat</text><path d="M140.4 245.3L359.6 198.7" stroke="currentColor" stroke-opacity="1" stroke-width="2.2"/><text x="367.55253128218624" y="202.71389062841095" text-anchor="start" font-size="11.5" class="d-muted">hit beat t</text><path d="M34 312C40 170 150 330 250 222" fill="none" class="d-accent" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="38.2" y="254.5" width="22" height="8" rx="2" class="d-box-accent" stroke-width="1.2" transform="rotate(-43.9 49.2 258.5)" opacity="0.57"/><rect x="83.9" y="247.8" width="22" height="8" rx="2" class="d-box-accent" stroke-width="1.2" transform="rotate(10.9 94.9 251.8)" opacity="0.72"/><rect x="149.4" y="258.2" width="22" height="8" rx="2" class="d-box-accent" stroke-width="1.2" transform="rotate(0.3 160.4 262.2)" opacity="0.87"/><text x="56" y="330" text-anchor="start" font-size="11.5" class="d-muted">approach path: keyframes, easing, scale, opacity</text><circle cx="250" cy="222" r="11" fill="none" class="d-accent" stroke-width="1.3"/><path d="M250 217.5L254.5 222L250 226.5L245.5 222Z" class="d-accent-fill d-accent" fill="" stroke-width="1.3"/><text x="254" y="254" text-anchor="middle" font-size="11.5" class="d-muted">hit point</text><path d="M266 230 L400 250 L462 150" class="d-accent" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#dj-head-a)"/><rect x="470" y="44" width="275" height="164" rx="4" class="d-box-accent" stroke-width="1"/><path d="M480 44h16" class="d-accent" stroke-width="2"/><text x="486" y="74" font-size="12.5" font-weight="600">Beat</text><text x="556" y="74" font-size="12.5">32.0, from the chart</text><text x="486" y="102" font-size="12.5" font-weight="600">Target</text><text x="556" y="102" font-size="12.5">line L2 at position 0.62</text><text x="486" y="130" font-size="12.5" font-weight="600">Action</text><text x="556" y="130" font-size="12.5">tap</text><text x="486" y="158" font-size="12.5" font-weight="600">Perfect</text><text x="556" y="158" font-size="12.5">within ±100 ms</text><text x="486" y="186" font-size="12.5" font-weight="600">Great</text><text x="556" y="186" font-size="12.5">within ±250 ms</text><rect x="470" y="226" width="275" height="104" rx="4" class="d-box" stroke-width="1" stroke-dasharray="4 3"/><text x="486" y="250" text-anchor="start" class="d-label">FREE TO CHANGE</text><text x="486" y="272" text-anchor="start" font-size="12" class="d-muted">· approach keys and easing</text><text x="486" y="289" text-anchor="start" font-size="12" class="d-muted">· line motion between hits</text><text x="486" y="306" text-anchor="start" font-size="12" class="d-muted">· layers, effects, camera</text><text x="486" y="323" text-anchor="start" font-size="12" class="d-muted">· visual-only notes (never judged)</text></svg>